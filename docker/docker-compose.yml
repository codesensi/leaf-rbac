include:
  # 仅在 DB_MODE=managed 时加载数据库定义文件
  # DB_MODE=external 时变量插值为不存在的文件，required:false 静默跳过
  - path: db-${DB_TYPE}-${DB_MODE}.yml
  - path: db-redis-${REDIS_MODE}.yml
services:
  leaf-rbac:
    deploy:
      resources:
        limits:
          memory: 1G
          cpus: 2
    image: codesensi/leaf-rbac:latest
    container_name: leaf-rbac
    restart: unless-stopped
    ports: [ "9098:9098" ]
    volumes:
      - /docker/leafrbac/data:/app/data
      - /docker/leafrbac/logs:/app/logs
    environment:
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:prod}
      APP_DB_TYPE: ${DB_TYPE:h2}
      APP_DB_MODE: ${DB_MODE:-}
      APP_REDIS_MODE: ${REDIS_MODE:-}
      # Redis 连接配置
      REDIS_HOST: ${REDIS_HOST:-}
      REDIS_PORT: ${REDIS_PORT:-}
      REDIS_PASSWORD: ${REDIS_PASSWORD:-}
      # MySQL 连接配置（仅当 APP_DB_TYPE=mysql 时生效）
      MYSQL_URL: ${MYSQL_URL:-}
      MYSQL_USERNAME: ${MYSQL_USERNAME:-}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-}
      # PostgreSQL 连接配置（仅当 APP_DB_TYPE=postgresql 时生效）
      POSTGRESQL_URL: ${POSTGRESQL_URL:-}
      POSTGRESQL_USERNAME: ${POSTGRESQL_USERNAME:-}
      POSTGRESQL_PASSWORD: ${POSTGRESQL_PASSWORD:-}
      # JVM 参数
      JAVA_OPTS: "-XX:+UseContainerSupport -XX:MaxRAMPercentage=75.0"
    healthcheck:
      # wget -qO-: 静默请求并将响应输出到 stdout，不产生临时文件
      # || exit 1: 请求失败时返回非零退出码，标记为 unhealthy
      # 使用容器内部 localhost:9098，与宿主机端口映射无关
      test: [ "CMD-SHELL", "wget -qO- http://localhost:9098/actuator/health || exit 1" ]
      # 每 30 秒执行一次检查
      interval: 30s
      # 单次检查超时时间，超时视为失败
      timeout: 10s
      # 连续失败 3 次后才标记为 unhealthy，避免瞬时抖动误判
      retries: 3
      # 启动宽限期：Spring Boot 冷启动较慢，此期间失败不计入重试次数
      start_period: 40s