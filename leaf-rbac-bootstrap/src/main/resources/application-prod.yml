# 数据库连接配置
spring:
  datasource:
    type: com.zaxxer.hikari.HikariDataSource
    hikari:
      # 客户端从连接池等待连接的最大毫秒数
      connection-timeout: 20000
      # 连接池中维护的最小空闲连接数
      minimum-idle: 10
      # 最大连接池数大小
      maximum-pool-size: 50
      # 允许一个连接在连接池中闲置的最大毫秒数
      idle-timeout: 300000
      # 池中连接关闭后的最长生存毫秒数
      max-lifetime: 1200000
      # 从池中返回的连接的默认自动提交行为
      auto-commit: true
      # 禁止在应用启动阶段因获取数据库连接失败而抛出异常或阻止应用启动
      initialization-fail-timeout: -1
  cache:
    type: redis
  # redis配置
  data:
    redis:
      database: 1
      host: 192.168.2.3
      password: redis_kiGRPw
      port: 6379
      timeout: 60s
      lettuce:
        pool:
          # 连接池最大连接数（使用负值表示没有限制）
          max-active: 200
          # 连接池中的最大空闲连接
          max-idle: 10
          # 连接池中的最小空闲连接
          min-idle: 5
          # 连接池最大阻塞等待时间（使用负值表示没有限制）
          max-wait: 60s

# 线程池配置
thread:
  pool:
    # 设置核心线程数
    core-pool-size: 10
    # 设置最大线程数
    max-pool-size: 50
    # 设置缓冲队列大小
    queue-capacity: 200
    # 设置线程的最大空闲秒数
    keep-alive-seconds: 30
    # 是否允许核心线程超时
    allow-core-thread-timeout: true
    # 是否等待剩余任务完成后才关闭应用
    wait-for-tasks-to-complete-on-shutdown: true
    # 等待剩余任务完成的最大秒数
    await-termination-seconds: 120
    # 拒绝策略
    rejected-execution-handler: CallerRunsPolicy

# 生产环境关闭API文档
springdoc:
  swagger-ui:
    enabled: false
  api-docs:
    enabled: false

# 项目配置
app:
  db:
    type: ${DB_TYPE:h2}
    h2:
      url: jdbc:h2:./data/leaf_rbac;DB_CLOSE_DELAY=-1;MODE=MySQL
      username: sa
      password:
      driver-class-name: org.h2.Driver
    mysql:
      url: jdbc:mysql://${MYSQL_URL}/leaf_rbac?useSSL=false&characterEncoding=utf8&serverTimezone=Asia/Shanghai
      username: ${MYSQL_USERNAME}
      password: ${MYSQL_PASSWORD}
      driver-class-name: com.mysql.cj.jdbc.Driver
    postgresql:
      url: jdbc:postgresql://${POSTGRESQL_URL}/leaf_rbac?ssl=false&sslmode=disable&client_encoding=UTF8&timezone=Asia/Shanghai
      username: ${POSTGRESQL_USERNAME}
      password: ${POSTGRESQL_PASSWORD}
      driver-class-name: org.postgresql.Driver
  demo-mode: false