spring:
  application:
    name: leaf-rbac
  lifecycle:
    # 优雅停机最大等待时间
    timeout-per-shutdown-phase: 60s
  profiles:
    active: dev
  jackson:
    date-format: yyyy-MM-dd HH:mm:ss
server:
  port: 9098
  # 开启优雅停机
  shutdown: graceful
# logback日志配置
logging:
  level:
    cn.codesensi.leaf: info
  pattern:
    dateformat: yyyy-MM-dd HH:mm:ss.SSS
    console: '%clr(%d{yyyy-MM-dd HH:mm:ss.SSS}){faint} %clr(${LOG_LEVEL_PATTERN:%5p}) %clr(${PID:- }){magenta} %clr(---){faint} %clr([%t]){faint} [${spring.profiles.active}] [%X{traceId:-}] %clr(%-40.40logger{39}){cyan} %clr(:){faint} %m%n'
    file: '%d{yyyy-MM-dd HH:mm:ss.SSS} ${LOG_LEVEL_PATTERN:%5p} ${PID:- } --- [%t] [${spring.profiles.active}] [%X{traceId:-}] %-40.40logger{39} : %m%n'
  file:
    name: ./logs/${spring.application.name}_${spring.profiles.active}.log
  logback:
    rollingpolicy:
      file-name-pattern: ${logging.file.name}.%d.%i.log
      max-file-size: 100MB
      max-history: 180

# springdoc-openapi项目配置
springdoc:
  # Swagger UI 路径（默认 /swagger-ui.html）
  swagger-ui:
    path: /swagger-ui.html
    # 接口排序（method:按方法排序，alpha:按字母排序）
    tags-sorter: alpha
    operations-sorter: alpha
    # 是否折叠或展开（list: 展开标签列表，折叠操作，默认值。full: 完全展开所有标签和操作。none: 全部折叠，只显示标签标题。）
    doc-expansion: none
  # API 文档路径（默认 /v3/api-docs）
  api-docs:
    path: /v3/api-docs
  group-configs:
    - group: 'default'
      paths-to-match: '/**'
      # 指定扫描的包（多个用逗号隔开）
      packages-to-scan: cn.codesensi.leaf.rbac.api

# mybatis-flex配置
mybatis-flex:
  global-config:
    key-config:
      key-type: generator
      value: snowFlakeId
    logic-delete-column: del_flag

# sa-token配置
sa-token:
  # token前缀
  token-prefix: Bearer
  # token 名称（同时也是 cookie 名称）
  token-name: Authorization
  # token 有效期（单位：秒） 默认30天，-1 代表永久有效
  timeout: 7200
  # token 最低活跃频率（单位：秒），如果 token 超过此时间没有访问系统就会被冻结，默认-1 代表不限制，永不冻结
  active-timeout: -1
  # 是否允许同一账号多地同时登录 （为 true 时允许一起登录, 为 false 时新登录挤掉旧登录）
  is-concurrent: true
  # 在多人登录同一账号时，是否共用一个 token （为 true 时所有登录共用一个 token, 为 false 时每次登录新建一个 token）
  is-share: false
  # token 风格（默认可取值：uuid、simple-uuid、random-32、random-64、random-128、tik）
  token-style: random-128
  # 是否输出操作日志
  is-log: false
  # jwt秘钥
  jwt-secret-key: f3c55ed9e4f54edfa8867f904aef6742

# 项目配置
app:
  # 锁文件
  lock-file: ./data/app.lock
  # 名称
  name: 一叶后台管理系统
  # 版本
  version: @project.version@
  # 负责人
  author: codesensi
  # 版权
  copyright: 2026
