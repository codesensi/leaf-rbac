# logback日志配置
logging:
  level:
    # trace级别可打印sql结果
    cn.codesensi.leaf: trace

# 数据库连接配置
spring:
  datasource:
    type: com.zaxxer.hikari.HikariDataSource
    hikari:
      # 客户端从连接池等待连接的最大毫秒数
      connection-timeout: 20000
      # 连接池中维护的最小空闲连接数
      minimum-idle: 5
      # 最大连接池数大小
      maximum-pool-size: 20
      # 允许一个连接在连接池中闲置的最大毫秒数
      idle-timeout: 300000
      # 池中连接关闭后的最长生存毫秒数
      max-lifetime: 1200000
      # 从池中返回的连接的默认自动提交行为
      auto-commit: true
      # 禁止在应用启动阶段因获取数据库连接失败而抛出异常或阻止应用启动
      initialization-fail-timeout: -1
  cache:
    type: redis
    redis:
      # 缓存空值，防缓存穿透
      cache-null-values: true
  # redis配置
  data:
    redis:
      database: 1
      host: 192.168.2.3
      password: redis_kiGRPw
      port: 6379
      timeout: 60s
      lettuce:
        pool:
          # 连接池最大连接数（使用负值表示没有限制）
          max-active: 200
          # 连接池中的最大空闲连接
          max-idle: 10
          # 连接池中的最小空闲连接
          min-idle: 5
          # 连接池最大阻塞等待时间（使用负值表示没有限制）
          max-wait: 60s

# sa-token配置
sa-token:
  # 是否输出操作日志
  is-log: true
  # jwt秘钥
  jwt-secret-key: f3c55ed9e4f54edfa8867f904aef6742

# bucket4j配置
bucket4j:
  enabled: true
  cache-to-use: redis-lettuce
  default-http-content-type: application/json;charset=UTF-8
  default-http-response-body: '{"code": 429, "msg": "请求过于频繁，请稍后重试", "data": null, "timestamp": 0}'
  filters:
    # ==================== 场景1: 登录接口 —— IP 限流防暴力破解 ====================
    # 需要限流的接口路径
    - url: /auth/login
      rate-limits:
        # 限流缓存的key，客户端IP
        # T(cn.codesensi.leaf.rbac.framework.util.IpUtil).getIpAddr(#root) #root 表示传入 HttpServletRequest 对象
        - cache-key: "T(cn.codesensi.leaf.rbac.framework.util.IpUtil).getIpAddr(#root)"
          bandwidths:
            # 每分钟最多 5 次
            - capacity: 5
              time: 1
              unit: minutes
            # 每小时最多 20 次
            - capacity: 20
              time: 1
              unit: hours
            # 每天最多 50 次
            - capacity: 50
              time: 1
              unit: days
    # ==================== 场景2: 验证码接口 —— IP 限流防刷 ====================
    - url: /captcha
      rate-limits:
        - cache-key: "T(cn.codesensi.leaf.rbac.framework.util.IpUtil).getIpAddr(#root)"
          bandwidths:
            # 每分钟 3 次，不攒令牌
            - capacity: 3
              time: 1
              unit: minutes
    # ==================== 场景3: 系统管理接口 —— 用户 ID 限流 ====================
    # ==================== 需 filter-order: -102 让 Bucket4j 在 UserContextFilter(-103) 之后执行 ====================
    - url: /sys/.*
      filter-order: -102
      rate-limits:
        - cache-key: "T(cn.codesensi.leaf.rbac.framework.context.UserContextHolder).getUserId()"
          bandwidths:
            - capacity: 100
              time: 1
              unit: minutes
    # ==================== 场景4: 全局兜底 —— 所有接口按 IP 限流 ====================
    - url: /.*
      rate-limits:
        - cache-key: "T(cn.codesensi.leaf.rbac.framework.util.IpUtil).getIpAddr(#root)"
          bandwidths:
            # 每分钟每 IP 最多 200 次
            - capacity: 200
              time: 1
              unit: minutes

# 线程池配置
thread:
  pool:
    # 设置核心线程数
    core-pool-size: 5
    # 设置最大线程数
    max-pool-size: 20
    # 设置缓冲队列大小
    queue-capacity: 100
    # 设置线程的最大空闲秒数
    keep-alive-seconds: 30
    # 是否允许核心线程超时
    allow-core-thread-timeout: true
    # 是否等待剩余任务完成后才关闭应用
    wait-for-tasks-to-complete-on-shutdown: true
    # 等待剩余任务完成的最大秒数
    await-termination-seconds: 60
    # 拒绝策略
    rejected-execution-handler: CallerRunsPolicy

# 项目配置
app:
  # 数据库配置
  db:
    type: mysql
    h2:
      url: jdbc:h2:./data/leaf_rbac_dev;DB_CLOSE_DELAY=-1;MODE=MySQL
      username: sa
      password:
      driver-class-name: org.h2.Driver
    mysql:
      url: jdbc:mysql://192.168.2.3:3306/leaf_rbac_dev?useSSL=false&characterEncoding=utf8&serverTimezone=Asia/Shanghai&tinyInt1isBit=false
      username: root
      password: mysql_GzxMw2
      driver-class-name: com.mysql.cj.jdbc.Driver
    postgresql:
      url: jdbc:postgresql://192.168.2.3:5432/leaf_rbac_dev?ssl=false&sslmode=disable&client_encoding=UTF8&timezone=Asia/Shanghai
      username: postgres
      password: postgres_saiFPX
      driver-class-name: org.postgresql.Driver
  demo-mode: false
  # 民政部地名服务
  mca-dmfw-api: https://dmfw.mca.gov.cn/9095/xzqh/getList?maxLevel=3
  # 验证码配置
  captcha:
    enabled: false
    # 验证码类型
    type: image
    # 图形验证码类型，验证码类型为图形时需配置
    image-type: arithmetic
    # 图形验证码过期时间，单位秒。5分钟
    image-expire: 300
    # 短信验证码过期时间，单位秒。15 分钟
    sms-expire: 900
    # 短信验证码长度
    sms-length: 6
  # 安全配置
  security:
    # 请求缓存限制 5M
    request-cache-limit: 5242880
  # 缓存配置
  cache:
    # 默认基准时间，单位秒。7 天
    base-ttl: 604800
    # 缓存随机偏移上限，单位秒。1 天
    max-extra: 86400
    # 项目启动时行政区划缓存开关
    preload-region: false
    # 项目启动时字典缓存开关
    preload-dict: true
  # 请求日志配置 已使用logbook替代，若想开启，需放开cn.codesensi.leaf.rbac.framework.filter.RequestLogFilter的注释
  request-log:
    # 是否打印请求日志
    enabled: true
    # 是否打印响应体
    include-response-body: true
    # 打印 body 的最大长度
    max-body-length: 2000
    # 脱敏字段列表
    sensitive-fields:
      - password
      - oldPassword
      - newPassword
      - accessToken
